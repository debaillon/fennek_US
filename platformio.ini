; =============================================================================
; LilyGO T-Deck Pro — minimal MP3 player (rebuild)
;
; Focus: responsive touch UI and stutter-free MP3 playback.
; Hardware: ESP32-S3, 8 MB PSRAM, GDEQ031T10 E-Ink (240x320),
;           CST328 touch (I2C), PCM5102A DAC (I2S), SD card (shared SPI).
;
; This toolchain intentionally matches the archived legacy build because
; these exact versions were tested on the hardware:
;   - espressif32 6.11.0  (Arduino-ESP32 2.0.17 / IDF 4.4)
;   - ESP32-audioI2S 2.0.6 (compatible with the legacy I2S API)
; The old MeshCore code (Meck fork) is available in Git history.
; =============================================================================

[platformio]
default_envs = fennek

[env:fennek]
platform = platformio/espressif32@6.11.0
board = t-deck_pro
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB

build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D CORE_DEBUG_LEVEL=1
  ; Prefer PSRAM for allocations above the threshold (audio buffers use PSRAM).
  -D CONFIG_SPIRAM_USE_MALLOC=1
  ; E-Ink model for GxEPD2 (3.1" GDEQ031T10, 240x320).
  -D EINK_DISPLAY_MODEL=GxEPD2_310_GDEQ031T10
  ; Enable the vendored Hynitron touch stack (CST328) for the Pro variant.
  -D FENNEK_HYN_TOUCH_PRO=1
  ; Diagnostic: -D AUDIO_DEBUG_GAP measures the maximum audio.loop() gap (stutter test).
  ; Debug: -D BATTLOG logs battery level and activity (app/audio/mesh/Wi-Fi/
  ;   standby), with timestamps, to /.fennek/battery.log (services/battlog.*).
  ;   Intended for power-use analysis; remove this line to disable it.
  -D BATTLOG
; --- MeshCore (lib/meshcore, vendored) + LoRa SX1262 ---
  ; Compile-time defaults = "USA/Canada": 910.525 MHz,
  ; BW 62.5 kHz, SF 7, CR 4/5.
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH
  -D SX126X_DIO3_TCXO_VOLTAGE=2.4f
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D MAX_CONTACTS=64
  -D MAX_GROUP_CHANNELS=8
  ; Increase the loopTask stack from 8 KB to 16 KB. HTTPClient and
  ; WiFiClientSecure use ~4–6 KB of stack; without this reserve, podcast
  ; downloads caused a stack-canary overflow (Guru Meditation:
  ; "Stack canary watchpoint triggered").
  ; WARNING: sdkconfig.h (qio_qspi) redefines CONFIG_ARDUINO_LOOP_STACK_SIZE
  ; as 8192 without an #ifndef guard. Set ARDUINO_LOOP_STACK_SIZE directly so
  ; the #ifndef block in main.cpp is skipped entirely.
  -D ARDUINO_LOOP_STACK_SIZE=16384

lib_deps =
  zinggjm/GxEPD2 @ ^1.5.9
  adafruit/Adafruit GFX Library @ ^1.11.0
  https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6
  jgromes/RadioLib @ ^7.3.0
  rweather/Crypto @ ^0.4.0
  densaugeo/base64 @ ^1.4.0
  lewisxhe/SensorLib @ ^0.2.0
